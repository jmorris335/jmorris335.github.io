<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2G129M5Q7Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-2G129M5Q7Y');

    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3; url=https://www.searchlaboratory.org/people">
    <link rel="canonical" href="https://www.searchlaboratory.org/people">
    <title>John Morris – Redirecting</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root {
            --primary: #002E5D;
            --primary-hover: #001f3f;
            --accent: #2e8b57;
            --bg: #f5f8fc;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .redirect-card {
            background: var(--card-bg);
            max-width: 540px;
            width: 100%;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 46, 93, 0.08), 0 8px 10px -6px rgba(0, 46, 93, 0.04);
            border: 1px solid var(--border);
            text-align: center;
        }

        .icon-container {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: rgba(0, 46, 93, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .spinner {
            position: absolute;
            width: 56px;
            height: 56px;
            border: 3px solid rgba(0, 46, 93, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .icon-container svg {
            width: 26px;
            height: 26px;
            color: var(--primary);
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .fallback-section {
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .fallback-section p {
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--primary);
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .link-text {
            color: var(--accent);
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .link-text:hover {
            color: var(--primary);
        }
    </style>
    <script>
        setTimeout(function () {
            window.location.href = "https://www.searchlaboratory.org/people";
        }, 5000);
    </script>
</head>

<body>
    <main class="redirect-card">
        <div class="icon-container" aria-hidden="true">
            <div class="spinner"></div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
        </div>

        <p class="message">
            This site has been retired. 

            Current information about Dr. Morris is available at <a href="https://www.searchlaboratory.org" class="link-text">searchlaboratory.org</a>. You are being automatically redirected...
        </p>

        <div class="fallback-section">
            <p>If you are not automatically redirected, please click below:</p>
            <a href="https://www.searchlaboratory.org/people" class="btn" id="redirect-link">
                Continue to searchlaboratory.org
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>
    </main>
</body>

</html>
